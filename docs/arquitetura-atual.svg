<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ahBlue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#2563eb"/>
    </marker>
    <marker id="ahRed" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#dc2626"/>
    </marker>
    <marker id="ahGreen" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#16a34a"/>
    </marker>
    <marker id="ahDark" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1150" fill="#f8fafc"/>

  <!-- ===== Título ===== -->
  <text x="800" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">PDV Lanchonete v2 — Arquitetura atual (desenvolvimento local)</text>
  <text x="800" y="68" text-anchor="middle" font-size="14" fill="#475569">React + TypeScript · FastAPI · Firebase (Auth + Firestore) · tudo na sua máquina — nada em produção ainda</text>
  <rect x="1180" y="22" width="372" height="30" rx="15" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="1366" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#854d0e">⚠ R$ 0/mês · plano Spark / free tiers</text>

  <!-- ===================== COLUNA 1: CLIENTES ===================== -->
  <rect x="50" y="100" width="450" height="38" rx="10" fill="#2563eb"/>
  <text x="66" y="125" font-size="15" font-weight="700" fill="#ffffff">CLIENTES</text>
  <rect x="50" y="138" width="450" height="342" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>

  <rect x="66" y="154" width="418" height="132" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="80" y="176" font-size="14" font-weight="700" fill="#1d4ed8">🖥️ Navegador — operação interna</text>
  <text x="80" y="198" font-size="12.5" fill="#334155">Garçom · caixa · cozinha (KDS)</text>
  <text x="80" y="217" font-size="12.5" fill="#334155">Telas: Mesas, PDV, KDS, Caixa, Estoque,</text>
  <text x="92" y="235" font-size="12.5" fill="#334155">Financeiro/DRE, Relatórios, Configurações</text>
  <text x="80" y="254" font-size="12.5" fill="#334155">React Query (cache) + useRealtime</text>
  <text x="80" y="273" font-size="12.5" fill="#334155">PWA instalável · tema por usuário · export CSV</text>

  <rect x="66" y="298" width="418" height="112" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="80" y="320" font-size="14" font-weight="700" fill="#1d4ed8">📱 Celular do cliente — cardápio digital QR</text>
  <text x="80" y="342" font-size="12.5" fill="#334155">Escaneia o QR da mesa → rota pública /m/{rid}/{mesa}</text>
  <text x="80" y="361" font-size="12.5" fill="#334155">Sem login: vê o cardápio e envia pedidos;</text>
  <text x="80" y="380" font-size="12.5" fill="#334155">mesa livre cria pedido, mesa ocupada adiciona itens</text>

  <!-- ===================== COLUNA 2: FRONTEND ===================== -->
  <rect x="590" y="100" width="450" height="38" rx="10" fill="#ea580c"/>
  <text x="606" y="125" font-size="15" font-weight="700" fill="#ffffff">FRONTEND — Vite dev server :5173</text>
  <rect x="590" y="138" width="450" height="342" rx="10" fill="#fff7ed" stroke="#fed7aa"/>

  <rect x="606" y="154" width="418" height="86" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="620" y="176" font-size="14" font-weight="700" fill="#c2410c">Servidor de desenvolvimento</text>
  <text x="620" y="199" font-size="12.5" fill="#334155">npm run dev → http://localhost:5173</text>
  <text x="620" y="220" font-size="12.5" fill="#334155">Proxy /api → http://localhost:8000</text>

  <rect x="606" y="252" width="418" height="212" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="620" y="274" font-size="14" font-weight="700" fill="#c2410c">SPA React 18 + TypeScript + Tailwind 4</text>
  <circle cx="630" cy="293" r="9" fill="#0f172a"/><text x="630" y="297" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">3</text>
  <text x="646" y="297" font-size="12.5" fill="#334155">lib/api.ts injeta Authorization: Bearer &lt;ID token&gt;</text>
  <circle cx="630" cy="315" r="9" fill="#0f172a"/><text x="630" y="319" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">7</text>
  <text x="646" y="319" font-size="12.5" fill="#334155">lib/apiPublico.ts: rotas públicas, sem token</text>
  <text x="620" y="341" font-size="12.5" fill="#334155">react-query + useRealtime (onSnapshot)</text>
  <text x="620" y="362" font-size="12.5" fill="#334155">ThemeContext (dark/light por usuário)</text>
  <text x="620" y="383" font-size="12.5" fill="#334155">PWA: vite-plugin-pwa + workbox NetworkFirst /api/*</text>
  <text x="620" y="404" font-size="12.5" fill="#334155">CSV (; + BOM p/ Excel) · QR PNG por mesa</text>

  <!-- ===================== COLUNA 3: BACKEND ===================== -->
  <rect x="1130" y="100" width="420" height="38" rx="10" fill="#16a34a"/>
  <text x="1146" y="125" font-size="15" font-weight="700" fill="#ffffff">BACKEND — FastAPI · uvicorn :8000</text>
  <rect x="1130" y="138" width="420" height="342" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>

  <rect x="1146" y="154" width="388" height="74" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="1160" y="176" font-size="14" font-weight="700" fill="#15803d">app/main.py — instância única do FastAPI</text>
  <text x="1160" y="199" font-size="12.5" fill="#334155">CORS configurável + lifespan + routers em /api</text>

  <rect x="1146" y="240" width="388" height="88" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="1160" y="262" font-size="14" font-weight="700" fill="#15803d">core/security.py — autenticação</text>
  <circle cx="1170" cy="283" r="9" fill="#0f172a"/><text x="1170" y="287" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">4</text>
  <text x="1186" y="287" font-size="12.5" fill="#334155">Valida o ID token; exige claims:</text>
  <text x="1186" y="308" font-size="11.5" fill="#334155" font-family="Consolas, monospace">restaurantId + papel (guards por papel)</text>

  <rect x="1146" y="340" width="388" height="132" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="1160" y="362" font-size="14" font-weight="700" fill="#15803d">services/ — regras de negócio</text>
  <text x="1160" y="386" font-size="12.5" fill="#334155">@transactional: mesa, caixa, estoque, baixa</text>
  <text x="1160" y="407" font-size="12.5" fill="#334155">Preço sempre resolvido no servidor</text>
  <text x="1160" y="428" font-size="12.5" fill="#334155">Rotas públicas com rate-limit 12/min/IP</text>
  <text x="1160" y="449" font-size="12.5" fill="#334155">Baixa de ingredientes ao iniciar preparo</text>
  <text x="1160" y="470" font-size="12.5" fill="#334155">pytest 23 testes · suíte E2E da API 34 testes</text>

  <!-- ===== Setas horizontais entre colunas ===== -->
  <line x1="500" y1="300" x2="586" y2="300" stroke="#334155" stroke-width="2" marker-end="url(#ahDark)"/>
  <text x="545" y="290" text-anchor="middle" font-size="11" fill="#475569">abre a SPA</text>
  <line x1="1040" y1="300" x2="1126" y2="300" stroke="#334155" stroke-width="2" marker-end="url(#ahDark)"/>
  <text x="1083" y="290" text-anchor="middle" font-size="11" fill="#475569">proxy /api</text>

  <!-- ===== Setas verticais colunas -> Firebase ===== -->
  <line x1="275" y1="480" x2="303" y2="526" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ahBlue)"/>
  <circle cx="234" cy="506" r="11" fill="#0f172a"/><text x="234" y="510" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text>
  <circle cx="260" cy="506" r="11" fill="#0f172a"/><text x="260" y="510" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>
  <text x="62" y="511" font-size="11.5" font-weight="600" fill="#2563eb">SDK Firebase JS (direto)</text>

  <line x1="815" y1="480" x2="801" y2="526" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ahRed)"/>
  <circle cx="840" cy="506" r="11" fill="#0f172a"/><text x="840" y="510" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">6</text>
  <text x="858" y="511" font-size="11.5" font-weight="600" fill="#dc2626">onSnapshot (fallback: polling)</text>

  <line x1="1340" y1="480" x2="1340" y2="526" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ahGreen)"/>
  <circle cx="1312" cy="506" r="11" fill="#0f172a"/><text x="1312" y="510" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">5</text>
  <text x="1296" y="511" text-anchor="end" font-size="11.5" font-weight="600" fill="#15803d">Admin SDK + service-account.json</text>

  <!-- ===================== FAIXA FIREBASE ===================== -->
  <rect x="50" y="530" width="1500" height="38" rx="10" fill="#d97706"/>
  <text x="66" y="555" font-size="15" font-weight="700" fill="#ffffff">FIREBASE — projeto pdv-lanchonete-1fa79 (plano Spark · grátis)</text>
  <rect x="50" y="568" width="1500" height="280" rx="10" fill="#fffbeb" stroke="#fde68a"/>

  <rect x="66" y="582" width="478" height="118" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="80" y="604" font-size="14" font-weight="700" fill="#b45309">Firebase Auth (login)</text>
  <text x="80" y="626" font-size="12.5" fill="#334155">Contas e-mail/senha (ex.: admin@restaurante.com)</text>
  <text x="80" y="647" font-size="12.5" fill="#334155">Custom claims no token: restaurantId, papel</text>
  <text x="80" y="668" font-size="12.5" fill="#334155">ID token dura ~1h; SDK web renova sozinho</text>
  <text x="80" y="689" font-size="12.5" fill="#334155">Claims novos só valem no PRÓXIMO token</text>

  <rect x="560" y="582" width="478" height="118" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="574" y="604" font-size="14" font-weight="700" fill="#b45309">Firestore (banco de dados)</text>
  <text x="574" y="626" font-size="11.5" fill="#334155" font-family="Consolas, monospace">restaurantes/{rid}/data/{colecao}/items/{id}</text>
  <text x="574" y="644" font-size="11.5" fill="#334155" font-family="Consolas, monospace">+ doc único: data/configuracoes</text>
  <text x="574" y="665" font-size="12.5" fill="#334155">Coleções: mesas, produtos, categorias, pedidos,</text>
  <text x="586" y="683" font-size="12.5" fill="#334155">pagamentos, caixas, estoque, movimentações,</text>
  <text x="574" y="701" font-size="12.5" fill="#334155">fornecedores, despesas, usuarios · onboarding/{uid}</text>

  <rect x="1054" y="582" width="480" height="118" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="1068" y="604" font-size="14" font-weight="700" fill="#b45309">Admin SDK (acesso privilegiado)</text>
  <text x="1068" y="626" font-size="12.5" fill="#334155">Backend ignora as rules (acesso total)</text>
  <text x="1068" y="647" font-size="12.5" fill="#334155">Autenticado por scripts/service-account.json</text>
  <text x="1068" y="671" font-size="12.5" font-weight="700" fill="#dc2626">⚠ SEGREDO — nunca versionar no GitHub</text>

  <!-- Aviso regras pendentes -->
  <rect x="66" y="712" width="1468" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="82" y="733" font-size="13" font-weight="700" fill="#b91c1c">⚠ firestore.rules escrito mas ainda NÃO publicado no projeto.</text>
  <text x="82" y="753" font-size="12.5" fill="#7f1d1d">Listeners onSnapshot do navegador recebem permission-denied → o app usa polling na API como fallback (tudo continua funcionando).</text>

  <!-- Info quotas -->
  <rect x="66" y="776" width="1468" height="52" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="82" y="797" font-size="13" font-weight="600" fill="#92400e">ℹ Quotas do plano Spark (grátis): 50k leituras / 20k escritas por dia no Firestore — listeners onSnapshot contam leituras.</text>
  <text x="82" y="817" font-size="12.5" fill="#92400e">Scripts Admin TS para init/seed/limpeza em scripts/ · backend exige pip install tzdata (zoneinfo no Windows).</text>

  <!-- ===================== IMPRESSORA ===================== -->
  <rect x="50" y="866" width="1500" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="7 5"/>
  <text x="800" y="891" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">🖨️ Impressora térmica ESC/POS</text>
  <text x="800" y="911" text-anchor="middle" font-size="12.5" fill="#475569">navegador ──Web Bluetooth (só funciona em HTTPS)──▶ impressora · comanda no KDS · recibo ao quitar pagamento · teste em Configurações</text>

  <!-- ===================== LEGENDA DOS FLUXOS ===================== -->
  <text x="50" y="962" font-size="15" font-weight="700" fill="#0f172a">FLUXOS PRINCIPAIS</text>
  <line x1="210" y1="957" x2="1550" y2="957" stroke="#cbd5e1" stroke-width="1"/>

  <circle cx="61" cy="991" r="11" fill="#0f172a"/><text x="61" y="995" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text>
  <text x="80" y="995" font-size="12.5" fill="#334155">Login: o navegador fala DIRETO com o Firebase Auth (SDK JS) — não passa pela sua API.</text>
  <circle cx="61" cy="1021" r="11" fill="#0f172a"/><text x="61" y="1025" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>
  <text x="80" y="1025" font-size="12.5" fill="#334155">O login devolve um ID token JWT (~1h); o SDK renova automaticamente antes de expirar.</text>
  <circle cx="61" cy="1051" r="11" fill="#0f172a"/><text x="61" y="1055" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text>
  <text x="80" y="1055" font-size="12.5" fill="#334155">Chamadas /api/*: fetch com Authorization: Bearer — no dev passam pelo proxy do Vite (:5173 → :8000).</text>
  <circle cx="61" cy="1081" r="11" fill="#0f172a"/><text x="61" y="1085" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4</text>
  <text x="80" y="1085" font-size="12.5" fill="#334155">FastAPI valida o token e os claims restaurantId/papel e aplica guards por papel.</text>

  <circle cx="831" cy="991" r="11" fill="#0f172a"/><text x="831" y="995" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">5</text>
  <text x="850" y="995" font-size="12.5" fill="#334155">Leitura/gravação de dados: backend → Firestore via Admin SDK (service-account.json local).</text>
  <circle cx="831" cy="1021" r="11" fill="#0f172a"/><text x="831" y="1025" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">6</text>
  <text x="850" y="1025" font-size="12.5" fill="#334155">Tempo real: navegador → Firestore (onSnapshot); com regras pendentes, fallback = polling na API.</text>
  <circle cx="831" cy="1051" r="11" fill="#0f172a"/><text x="831" y="1055" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">7</text>
  <text x="850" y="1055" font-size="12.5" fill="#334155">Cliente no QR: página pública /m/{rid}/{mesa} → endpoints /api/publico (sem auth, rate-limit).</text>
  <circle cx="831" cy="1081" r="11" fill="#0f172a"/><text x="831" y="1085" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">8</text>
  <text x="850" y="1085" font-size="12.5" fill="#334155">Impressão: navegador → Web Bluetooth → impressora térmica ESC/POS (comanda/recibo).</text>

  <text x="800" y="1130" text-anchor="middle" font-size="11.5" fill="#94a3b8">Estado em ago/2026 · próximos passos de produção (Render + Firebase Hosting) documentados em PLANO-CORRECOES.md</text>
</svg>
