name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:precificacao
      - run: npm run test:unidades
      - run: npm run test:seguranca
      - run: npx tsc --noEmit
      - run: npm run build

  # Regras do Firestore no emulador (P0-A). Java p/ binaries do emulador.
  # Roda em PR e push de master; falha bloqueia merge.
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - name: firebase emulators:exec (regras e produção concorrente)
        run: npx firebase-tools emulators:exec --only firestore --project demo-p0a "node tests/firestore_rules.test.mjs && PYTHONPATH=../backend python ../scripts/e2e/producao_emulator.py && PYTHONPATH=../backend python ../scripts/e2e/balcao_emulator.py && PYTHONPATH=../backend python ../scripts/e2e/evolucao_emulator.py"
        working-directory: frontend
