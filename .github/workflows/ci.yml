name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:precificacao
      - run: npm run test:unidades
      - run: npm run test:seguranca
      - run: node --test tests/modal-focus.test.mjs
      - run: npm run test:cardapio
      - run: npm run test:reposicao
      - run: npm run test:wiki
      - name: Instalar navegador para testes da Wiki
        run: |
          npm install --prefix "$RUNNER_TEMP/wiki-browser" --no-audit --no-fund playwright@1.51.1
          node "$RUNNER_TEMP/wiki-browser/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
      - name: Wiki - rotas, ajuda, mobile e preservacao de formularios
        run: npm run test:wiki:ui
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/wiki-browser/node_modules/playwright
      - name: Estoque - piloto visual e operacoes simuladas
        run: npm run test:estoque:ui
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/wiki-browser/node_modules/playwright
      - name: Visual do sistema - desktop, mobile e comanda
        run: npm run test:visual:ui
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/wiki-browser/node_modules/playwright
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run test:wiki:bundle
      - name: Wiki - cache PWA sem dados reais
        run: npm run test:wiki:pwa
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/wiki-browser/node_modules/playwright

  # Regras do Firestore no emulador (P0-A). Java p/ binaries do emulador.
  # Roda em PR e push de master; falha bloqueia merge.
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - name: firebase emulators:exec (regras e produção concorrente)
        run: npx firebase-tools emulators:exec --only firestore --project demo-p0a "node tests/firestore_rules.test.mjs && PYTHONPATH=../backend python ../scripts/e2e/producao_emulator.py && PYTHONPATH=../backend python ../scripts/e2e/balcao_emulator.py && PYTHONPATH=../backend python ../scripts/e2e/evolucao_emulator.py && PYTHONPATH=../backend python ../scripts/e2e/bi_emulator.py && PYTHONPATH=../backend python ../scripts/e2e/despesas_paginacao_emulator.py"
        working-directory: frontend

  scripts-publicacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell - atualizacao e deploy simulados
        shell: pwsh
        run: ./scripts/tests/publicacao.ps1
